<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pokedex</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/pokemons.css">
</head>
<body>
	<header>
		<div class="topo"></div>
		<div class="BarraSup">
			<div class="espaco"></div>
			<div class="caixa-logoTitulo">
				<div class="logo">
				</div>
				<div class="titulo">
					<h1>Pokedex</h1>
				</div>
			</div>
			<div>
				<input class="barraPesquisa" type="text" placeholder="Digite o nome do pokemon...">
			</div>
			<div>
			</div>
		</div>
		<div class="divisor"></div>
		<div class="BarraInf">
			<button class="botaoBarra" type="button">Pesquisar</button>
			<button class="botaoBarra" type="button">MinhaDex</button>
			<button class="botaoBarra" type="button">Favoritos</button>
		</div>
		<div class="embaixo"></div>
	</header>

    <section class="listagem">
        <div class="pokemon-grid">

        </div>
    </section>

    <script src="js/pokemons.js"></script>
    <script src="js/listarPokemons.js"></script>
    <script src="js/pokemonsFavoritos.js"></script>
</body>
</html>
